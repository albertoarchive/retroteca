<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jugando · Retroteca</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0e0c0a; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    .back {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 1000;
      background: #35f0a6; color: #002b1b; text-decoration: none; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
      font: 9px/1 "Press Start 2P", monospace; padding: 10px 11px; text-transform: uppercase;
    }
    .back:hover { background: #6bffc4; }
    .msg {
      position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: #f0e9dc;
      font: 16px/1.5 -apple-system, "Segoe UI", sans-serif; padding: 24px;
    }
    .msg a { color: #e0654a; }
  </style>
</head>
<body>
  <a class="back" href="index.html">◀ Menú</a>
  <div id="game"></div>
  <div class="msg" id="msg"></div>
  <script src="js/systems.js?v=2"></script>
  <script src="js/db.js?v=2"></script>
  <script src="js/player.js?v=2"></script>
</body>
</html>
